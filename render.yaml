services:
  # API (FastAPI + embedded SQLite/Qdrant). The service name is "api" because
  # nginx.conf proxies to http://api:8000 over Render's private network.
  - type: web
    name: api
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    disk:
      name: documind-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      # Add your KIE key in the Render dashboard when prompted.
      - key: KIE_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.kie.ai/codex/v1
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: LLM_TIMEOUT_SECONDS
        value: "240"
      - key: DATABASE_URL
        value: /app/data/documind.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: QDRANT_COLLECTION
        value: documind_chunks
      - key: QDRANT_LOCAL_PATH
        value: /app/data/qdrant
      - key: HF_HOME
        value: /app/data/hf-cache
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K
        value: "5"
      - key: MIN_SIMILARITY
        value: "0.08"

  # Web (React build served by nginx, /api proxied to the api service above).
  - type: web
    name: documind-web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 80
